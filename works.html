<script>

/* =========================
   Hovering category text
   ========================= */

document.querySelectorAll('.work-item').forEach(item => {

    const text = item.querySelector('.hover-text');

    if (!text) return;

    item.addEventListener('mousemove', (e) => {

        const rect = item.getBoundingClientRect();

        const textWidth = text.offsetWidth;
        const textHeight = text.offsetHeight;

        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        const minX = textWidth / 2;
        const maxX = rect.width - textWidth / 2;

        const minY = textHeight / 2;
        const maxY = rect.height - textHeight / 2;

        x = Math.max(minX, Math.min(x, maxX));
        y = Math.max(minY, Math.min(y, maxY));

        text.style.left = `${x}px`;
        text.style.top = `${y}px`;

        const distanceLeft = x - minX;
        const distanceRight = maxX - x;
        const distanceTop = y - minY;
        const distanceBottom = maxY - y;

        const nearestEdge = Math.min(
            distanceLeft,
            distanceRight,
            distanceTop,
            distanceBottom
        );

        const fadeDistance = 100;
        const opacity = Math.min(1, nearestEdge / fadeDistance);

        text.style.opacity = opacity;
    });

});


/* =========================
   Blade system
   ========================= */

document.querySelectorAll('.work-group').forEach(group => {

    const mainWork = group.querySelector('.main-work');
    const blades = group.querySelectorAll('.blade');

    let openTimers = [];


    /* Initial collapsed stack */

    blades.forEach((blade, index) => {

    blade.style.width = '100%';

    if (group.classList.contains('reverse-blades')) {

        blade.style.transform =
            `translateX(-${(index + 1) * 12}px)`;

    } else {

        blade.style.transform =
            `translateX(${(index + 1) * 12}px)`;

    }

    blade.style.zIndex = 10 - index;

});


    /* Open / close */

    mainWork.addEventListener('click', function () {

        /* Cancel any previous opening timers */

        openTimers.forEach(timer => clearTimeout(timer));
        openTimers = [];


        group.classList.toggle('open');


        if (group.classList.contains('open')) {

            const grid = group.closest('.works-grid');

            const gridLeft =
                grid.getBoundingClientRect().left;

            const groupLeft =
                group.getBoundingClientRect().left;

            const thumbWidth =
                group.offsetWidth;

            const bladeWidth =
                thumbWidth * 0.5;


            /* All blades shrink to 50% */

            blades.forEach(blade => {
                blade.style.width = '50%';
            });


            /* 5 columns × 2 rows */

            const columns = 5;


            /* Horizontal positioning */

            const targetRight =
                window.innerWidth - gridLeft;

            const finalBladeRight =
                targetRight - 36;

            const overlap =
                bladeWidth * 0.10;

            const horizontalStep =
                bladeWidth - overlap;

let firstX;
let lastX;


/* Normal left-side spread */

const normalLastX =
    finalBladeRight -
    groupLeft -
    bladeWidth;

const normalFirstX =
    normalLastX -
    horizontalStep * (columns - 1);


if (group.classList.contains('reverse-blades')) {

    /*
       Mirror the left-side spread.
       The minimized thumb is 71.5% of the original width,
       so the blades need to move outward by the amount
       removed from the thumb.
    */

const shrinkAmount =
    thumbWidth * (1 - 0.715) * 1.17;

    firstX =
        thumbWidth -
        normalLastX -
        bladeWidth -
        shrinkAmount;

    lastX =
        firstX -
        horizontalStep * (columns - 1);

} else {

    firstX =
        normalFirstX;

    lastX =
        normalLastX;
}


            /* Vertical spacing */

            const verticalGap =
                group.offsetHeight * 0.55;


            /* Position all blades */

            blades.forEach((blade, index) => {

                const column =
                    index % columns;

                const row =
                    Math.floor(index / columns);

                let x;

if (group.classList.contains('reverse-blades')) {

    x =
        firstX -
        horizontalStep * column;

} else {

    x =
        firstX +
        horizontalStep * column;
}

                const y =
                    verticalGap * row;

                blade.style.zIndex =
                    10 - index;


                const timer = setTimeout(() => {

                    blade.style.transform =
                        `translate(${x}px, ${y}px)`;

                }, index * 35);

                openTimers.push(timer);

            });

        } else {


            /* Return to closed state */

            /* Return to closed state */

blades.forEach((blade, index) => {

    blade.style.width = '100%';

    if (group.classList.contains('reverse-blades')) {

        blade.style.transform =
            `translateX(-${(index + 1) * 12}px)`;

    } else {

        blade.style.transform =
            `translateX(${(index + 1) * 12}px)`;

    }

    blade.style.zIndex = '';

});

        }

    });


    /* Blade hover growth */

    blades.forEach(blade => {

    blade.addEventListener('mouseenter', () => {

        if (group.classList.contains('open')) {

            blade.style.width = '65%';

            if (group.classList.contains('reverse-blades')) {
                blade.style.left = '-15%';
            }

            blade.style.zIndex = '20';

        }

    });


    blade.addEventListener('mouseleave', () => {

        if (group.classList.contains('open')) {

            blade.style.width = '50%';

            if (group.classList.contains('reverse-blades')) {
                blade.style.left = '0';
            }

            blade.style.zIndex = '';

        }

    });

});
});

</script>
